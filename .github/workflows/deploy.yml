# Publishes the add-in to GitHub Pages after every change to main. Templates live in SharePoint, not here.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a running deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build site
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Work out the public URLs
        env:
          CUSTOM_BASE_URL: ${{ vars.ADDIN_BASE_URL }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          base="${CUSTOM_BASE_URL:-$PAGES_BASE_URL}"
          base="${base%/}/"
          echo "ADDIN_BASE_URL=${base}" >> "$GITHUB_ENV"
          echo "Add-in will be published at ${base}"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: addin
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Settings come from repository variables (Settings > Secrets and variables > Actions > Variables).
      # They are not secrets: the client ID and tenant ID are visible in any single-page app.
      - name: Build the add-in
        working-directory: addin
        env:
          AUTH_CLIENT_ID: ${{ vars.AUTH_CLIENT_ID }}
          AUTH_TENANT_ID: ${{ vars.AUTH_TENANT_ID }}
          SHAREPOINT_SITE_URL: ${{ vars.SHAREPOINT_SITE_URL }}
          SHAREPOINT_LIBRARY: ${{ vars.SHAREPOINT_LIBRARY }}
          SHAREPOINT_FOLDER: ${{ vars.SHAREPOINT_FOLDER }}
        run: npm run build

      - name: Package the manifests for Microsoft 365 admin center
        working-directory: addin
        run: |
          mkdir -p manifest-package/assets
          cp dist/manifest.json manifest-package/
          cp dist/assets/color.png dist/assets/outline.png manifest-package/assets/
          (cd manifest-package && zip -r ../manifest-unified.zip .)

      - name: Upload manifests as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: addin-manifests
          path: |
            addin/manifest-unified.zip
            addin/dist/manifest.xml

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: addin/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
